<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Social Post & Hook Generator | Credit 2 Money Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --card: #121210;
      --card2: #171713;
      --line: #2a2618;
      --gold: #f7c948;
      --lime: #8fe03a;
      --text: #f5f3ea;
      --muted: #a8a28f;
      --gold-grad: linear-gradient(180deg,#fff4c2 0%,#f7c948 38%,#c98a06 70%,#f7c948 100%);
      --lime-grad: linear-gradient(180deg,#b8f56a,#8fe03a 45%,#5fb81c);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .generator-container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.85);
    }
    h2 {
      font-family: 'Exo 2', sans-serif;
      font-style: italic;
      font-weight: 900;
      color: var(--gold);
      text-transform: uppercase;
      font-size: 24px;
      margin-bottom: 8px;
    }
    p.sub { color: var(--muted); font-size: 13.5px; margin-bottom: 24px; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 6px;
      text-transform: uppercase;
      font-family: 'Exo 2', sans-serif;
    }
    select {
      width: 100%;
      background: #0b0b0a;
      border: 1px solid var(--line);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: "Exo 2", sans-serif;
      font-style: italic;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 12px 24px;
      border: 0;
      cursor: pointer;
      font-size: 0.9rem;
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
      transition: transform 0.15s, filter 0.2s;
    }
    .btn-gold { background: var(--gold-grad); color: #1a1200; }
    .btn-lime { background: var(--lime-grad); color: #0b1800; }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.15); }

    .post-card {
      margin-top: 32px;
      background: #0b0b0a;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      display: none;
    }
    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .post-preview {
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.6;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="generator-container">
    <h2>📱 C2M Viral Social Media Post Generator</h2>
    <p class="sub">Generate high-converting credit & funding posts instantly with pre-engineered viral retention hooks.</p>

    <div class="grid-2">
      <div>
        <label>Select Content Pillar</label>
        <select id="pillar">
          <option value="charge_offs">🛡️ Charge-Offs: Why Paying Them Ruins Your Score</option>
          <option value="stacking">💳 0% APR Credit Card Stacking: $100k Without Personal Debt</option>
          <option value="inquiries">⚡ Hard Inquiries: How to Delete in 48 Hours</option>
          <option value="chase_524">🏛️ Chase 5/24 Rule: The Secret Way Around It</option>
          <option value="secondaries">🔒 LexisNexis: The Secret Bureau You Must Freeze</option>
          <option value="flash_sale">⚡ The $100 Credit & Funding Secrets Flash Sale</option>

      </div>
      <div>
        <label>Target Platform Style</label>
        <select id="platform">
          <option value="ig_tiktok">Instagram / TikTok (Short, punchy, emojis, high-contrast)</option>
          <option value="linkedin">LinkedIn / Facebook (Authority, long-form, consulting)</option>
          <option value="x">X / Twitter (Fast thread & direct punch)</option>
        </select>
      </div>
    </div>

    <button class="btn btn-gold" style="width:100%;" onclick="generatePost()">⚡ Generate Viral Post Now</button>

    <div id="postCard" class="post-card">
      <div class="post-header">
        <span style="font-family:'Exo 2'; font-style:italic; font-weight:800; color:var(--lime);">READY TO COPY & PUBLISH</span>
        <button class="btn btn-lime" style="padding:6px 14px; font-size:11px;" onclick="copyPost()">📋 Copy Text</button>
      </div>
      <div id="postOutput" class="post-preview"></div>
    </div>
  </div>

  <script>

#BusinessCredit #CreditCardStacking #0PercentAPR #CreditToMoney #StartupFunding #Entrepreneurship #CapitalGrowth`,

      secondaries: `The secret credit bureau that is keeping your collections and public records alive. 👁️

      flash_sale: `⚡ 24-HOUR FLASH SALE: The 0% Business Funding & Credit Secrets Vault is LIVE!

For today only, Antoine Solomon is unlocking the internal vault we use to fix credit profiles and secure 6-figure business funding rounds for just $100 (normally $997).

✅ The 3-Round Metro 2® Factual Dispute Letters (Inquiries, Collections, Charge-Offs)
✅ The 0% APR Business Lender Database (Chase, Amex, US Bank rules)
✅ The 3-Wave Credit Card Stacking Sequencing Blueprint
✅ The Secondary Bureau Freeze Playbook

👉 Head to credit2money.org right now and claim your vault before the price resets!

    };

    function generatePost() {
      const pillar = document.getElementById('pillar').value;
      const content = posts[pillar] || posts.charge_offs;
      document.getElementById('postOutput').textContent = content;
      document.getElementById('postCard').style.display = 'block';
      document.getElementById('postCard').scrollIntoView({ behavior: 'smooth' });
    }

    function copyPost() {
      const text = document.getElementById('postOutput').textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert('Post copied to clipboard! Ready to paste into Instagram, LinkedIn, or Facebook!');
      });
    }
  </script>
</body>
</html>
